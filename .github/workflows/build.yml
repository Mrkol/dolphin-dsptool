name: Build DSPTool

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      dolphin_tag:
        type: string
        default: ''
      release_artifact:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2022
          - platform: linux-x64
            runner: ubuntu-22.04
          - platform: macos-x64
            runner: macos-15-intel
          - platform: macos-arm64
            runner: macos-15
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: inputs.release_artifact != ''
        with:
          name: ${{ inputs.release_artifact }}
          path: ${{ runner.temp }}/dsptool-release
      - name: Check out pinned release commit
        if: inputs.release_artifact != ''
        run: python scripts/release.py checkout --input "$RUNNER_TEMP/dsptool-release"
      - name: Test release orchestration
        run: python -m unittest discover -s tests -p test_release.py -v
      - name: Bootstrap sparse dependencies
        run: python scripts/bootstrap.py
      - name: Install Linux compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-12 ninja-build
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build and test
        run: |
          cmake --build build --config Release --parallel 3
          ctest --test-dir build -C Release --output-on-failure
          cmake --install build --config Release --prefix stage
      - name: Package and test release archives
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DOLPHIN_TAG: ${{ inputs.dolphin_tag }}
          COMMIT: ${{ github.sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          version="dev-${COMMIT:0:12}"
          if [[ -n "$RELEASE_VERSION" ]]; then version="$RELEASE_VERSION"; fi
          extra=()
          if [[ "$PLATFORM" == linux-x64 ]]; then extra+=(--source); fi
          python scripts/package.py --version "$version" --dolphin-tag "$DOLPHIN_TAG" --platform "$PLATFORM" "${extra[@]}"
      - name: Verify source archive builds independently
        if: runner.os == 'Linux'
        run: |
          mkdir build-source
          tar -xzf dist/*-source.tar.gz --strip-components=1 -C build-source
          cmake -S build-source -B build-source/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12
          cmake --build build-source/build --parallel 3
          ctest --test-dir build-source/build --output-on-failure
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dsptool-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
